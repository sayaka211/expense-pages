<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>経費メモ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #242429;
    --border: #2e2e36;
    --accent: #7fff6e;
    --accent2: #4fd1c5;
    --text: #f0f0f0;
    --text2: #888899;
    --danger: #ff6b6b;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding-bottom: 32px;
  }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,15,17,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .header-title span { color: var(--accent); }
  .month-badge {
    font-family: 'DM Mono', monospace; font-size: 13px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--accent2); padding: 4px 10px; border-radius: 20px;
  }

  .tabs {
    display: flex; background: var(--surface);
    border-bottom: 1px solid var(--border); padding: 0 8px;
  }
  .tab {
    flex: 1; padding: 12px 4px; text-align: center;
    font-size: 13px; font-weight: 500; color: var(--text2);
    cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 16px; }
  .hidden { display: none !important; }

  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .form-row { margin-bottom: 14px; }
  .form-label {
    font-size: 11px; font-weight: 500; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px; display: block;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px; padding: 10px 12px; outline: none; transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent2); }
  .form-select option { background: var(--surface2); }
  .form-textarea { height: 64px; resize: none; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

  .btn-add {
    width: 100%; background: var(--accent); color: #0f0f11;
    font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700;
    padding: 14px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
  }
  .btn-add:active { transform: scale(0.98); opacity: 0.85; }

  /* 候補サジェスト */
  .suggest-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--text2);
    cursor: pointer; transition: all 0.15s;
  }
  .chip:active { background: var(--accent2); color: #0f0f11; border-color: var(--accent2); }

  /* 一覧 */
  .month-filter {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 14px; scrollbar-width: none;
  }
  .month-filter::-webkit-scrollbar { display: none; }
  .mf-btn {
    flex-shrink: 0; padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-family: 'DM Mono', monospace;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); cursor: pointer; transition: all 0.15s;
  }
  .mf-btn.active { background: var(--accent2); border-color: var(--accent2); color: #0f0f11; font-weight: 700; }

  .list-empty { text-align: center; color: var(--text2); font-size: 14px; padding: 48px 16px; }
  .list-empty .empty-icon { font-size: 40px; margin-bottom: 8px; }

  .entry-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    display: flex; align-items: flex-start; gap: 12px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .entry-source-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .dot-receipt { background: var(--accent); }
  .dot-pdf { background: var(--accent2); }
  .dot-manual { background: #f6ad55; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .entry-summary { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-amount { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--accent); flex-shrink: 0; }
  .entry-meta { display: flex; gap: 8px; font-size: 11px; color: var(--text2); flex-wrap: wrap; }
  .entry-cat {
    background: var(--surface2); border-radius: 4px; padding: 1px 6px;
    font-size: 11px; color: var(--accent2); border: 1px solid var(--border);
  }
  .entry-delete { background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; padding: 0 0 0 4px; line-height: 1; flex-shrink: 0; }
  .entry-delete:active { color: var(--danger); }

  /* 出力タブ */
  .export-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .export-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .export-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent); }
  .month-summary-list { margin-bottom: 14px; }
  .month-summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .month-summary-row:last-child { border-bottom: none; }
  .month-summary-label { font-family: 'DM Mono', monospace; color: var(--accent2); }
  .month-summary-val { font-family: 'DM Mono', monospace; color: var(--accent); }
  .btn-export {
    width: 100%; background: var(--surface2); border: 1px solid var(--accent2);
    color: var(--accent2); font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
    font-weight: 700; padding: 12px; border-radius: 8px; cursor: pointer;
    transition: all 0.2s; margin-bottom: 8px; display: block;
  }
  .btn-export:active { background: var(--accent2); color: #0f0f11; }
  .btn-export.secondary { border-color: var(--text2); color: var(--text2); }

  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--accent);
    color: var(--accent); font-size: 13px; padding: 10px 20px;
    border-radius: 24px; opacity: 0; transition: all 0.3s; z-index: 999;
    white-space: nowrap; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">経費<span>メモ</span></div>
  <div class="month-badge" id="currentMonthBadge">----/--</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">＋ 入力</div>
  <div class="tab" onclick="switchTab('list')">一覧</div>
  <div class="tab" onclick="switchTab('export')">出力</div>
</div>

<!-- 入力タブ -->
<div class="content" id="tab-input">
  <div class="form-card">
    <div class="form-row-2">
      <div>
        <label class="form-label">日付</label>
        <input class="form-input" type="date" id="inputDate" />
      </div>
      <div>
        <label class="form-label">金額（円）</label>
        <input class="form-input" type="number" id="inputAmount" placeholder="0" inputmode="numeric" />
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">摘要（店名・内容）</label>
      <input class="form-input" type="text" id="inputSummary" placeholder="例：コンビニ、タトゥー用品" oninput="updateSuggest()" />
      <div class="suggest-chips" id="suggestChips"></div>
    </div>

    <div class="form-row-2">
      <div>
        <label class="form-label">勘定科目</label>
        <select class="form-select" id="inputCategory">
          <option value="">未分類</option>
          <option>消耗品費</option>
          <option>通信費</option>
          <option>交通費</option>
          <option>外注費</option>
          <option>広告宣伝費</option>
          <option>会議費</option>
          <option>接待交際費</option>
          <option>光熱費</option>
          <option>設備費</option>
          <option>福利厚生費</option>
          <option>その他</option>
        </select>
      </div>
      <div>
        <label class="form-label">ソース</label>
        <select class="form-select" id="inputSource">
          <option value="receipt">レシート</option>
          <option value="pdf">PDF領収書</option>
          <option value="manual">手入力</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">備考</label>
      <textarea class="form-textarea" id="inputNote" placeholder="任意メモ"></textarea>
    </div>

    <button class="btn-add" onclick="addEntry()">追加する</button>
  </div>
</div>

<!-- 一覧タブ -->
<div class="content hidden" id="tab-list">
  <div class="month-filter" id="monthFilter"></div>
  <div id="listContent"></div>
</div>

<!-- 出力タブ -->
<div class="content hidden" id="tab-export">
  <div class="export-card">
    <div class="export-title">サマリー</div>
    <div class="export-stats" id="exportStats"></div>
    <div class="month-summary-list" id="monthSummaryList"></div>
  </div>
  <div class="export-card">
    <div class="export-title">CSVエクスポート</div>
    <div class="form-row">
      <label class="form-label">対象月</label>
      <select class="form-select" id="exportMonthSelect"></select>
    </div>
    <button class="btn-export" onclick="exportCSV()">📥 選択月をダウンロード</button>
    <button class="btn-export secondary" onclick="exportAllCSV()">全月分をダウンロード</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'expense_v2';

function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function save(e) { localStorage.setItem(STORAGE_KEY, JSON.stringify(e)); }

// よく使う摘要サジェスト（過去履歴から生成）
function updateSuggest() {
  const val = document.getElementById('inputSummary').value.trim();
  const entries = load();
  const all = [...new Set(entries.map(e => e.summary))];
  const chips = document.getElementById('suggestChips');
  if (!val) { chips.innerHTML = ''; return; }
  const matches = all.filter(s => s.includes(val) && s !== val).slice(0, 5);
  chips.innerHTML = matches.map(s =>
    `<div class="chip" onclick="fillSummary('${s.replace(/'/g,"\\'")}')">↩ ${s}</div>`
  ).join('');
}
function fillSummary(s) {
  document.getElementById('inputSummary').value = s;
  document.getElementById('suggestChips').innerHTML = '';
  // 過去の同じ摘要から勘定科目を自動セット
  const entries = load();
  const prev = entries.filter(e => e.summary === s).pop();
  if (prev && prev.category) document.getElementById('inputCategory').value = prev.category;
}

window.onload = () => {
  const today = new Date();
  document.getElementById('inputDate').value = today.toISOString().slice(0,10);
  document.getElementById('currentMonthBadge').textContent =
    `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}`;
};

let selectedListMonth = 'all';

function switchTab(name) {
  ['input','list','export'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== name);
  });
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', ['input','list','export'][i] === name);
  });
  if (name === 'list') renderList();
  if (name === 'export') renderExport();
}

function addEntry() {
  const date = document.getElementById('inputDate').value;
  const amount = document.getElementById('inputAmount').value;
  const summary = document.getElementById('inputSummary').value.trim();
  if (!date || !amount || !summary) { showToast('日付・金額・摘要は必須です'); return; }

  const entries = load();
  entries.push({
    id: Date.now(), date,
    amount: parseInt(amount),
    summary,
    category: document.getElementById('inputCategory').value || '未分類',
    source: document.getElementById('inputSource').value,
    note: document.getElementById('inputNote').value.trim(),
    month: date.slice(0,7)
  });
  save(entries);

  document.getElementById('inputAmount').value = '';
  document.getElementById('inputSummary').value = '';
  document.getElementById('inputNote').value = '';
  document.getElementById('suggestChips').innerHTML = '';
  showToast('✓ 追加しました');
}

function renderList() {
  const entries = load();
  const months = [...new Set(entries.map(e => e.month))].sort().reverse();
  const mf = document.getElementById('monthFilter');
  mf.innerHTML = `<div class="mf-btn ${selectedListMonth==='all'?'active':''}" onclick="filterMonth('all')">全て</div>`;
  months.forEach(m => {
    mf.innerHTML += `<div class="mf-btn ${selectedListMonth===m?'active':''}" onclick="filterMonth('${m}')">${m}</div>`;
  });

  const filtered = (selectedListMonth === 'all' ? entries : entries.filter(e => e.month === selectedListMonth))
    .sort((a,b) => b.date.localeCompare(a.date));

  const lc = document.getElementById('listContent');
  if (!filtered.length) {
    lc.innerHTML = `<div class="list-empty"><div class="empty-icon">📋</div>データがありません</div>`;
    return;
  }
  const srcLabel = { receipt:'レシート', pdf:'PDF', manual:'手入力' };
  const dotCls = { receipt:'dot-receipt', pdf:'dot-pdf', manual:'dot-manual' };
  lc.innerHTML = filtered.map(e => `
    <div class="entry-card">
      <div class="entry-source-dot ${dotCls[e.source]||'dot-manual'}"></div>
      <div class="entry-body">
        <div class="entry-top">
          <div class="entry-summary">${e.summary}</div>
          <div class="entry-amount">¥${e.amount.toLocaleString()}</div>
        </div>
        <div class="entry-meta">
          <span>${e.date}</span>
          <span class="entry-cat">${e.category}</span>
          <span>${srcLabel[e.source]||e.source}</span>
          ${e.note?`<span>${e.note}</span>`:''}
        </div>
      </div>
      <button class="entry-delete" onclick="deleteEntry(${e.id})">×</button>
    </div>
  `).join('');
}

function filterMonth(m) { selectedListMonth = m; renderList(); }

function deleteEntry(id) {
  save(load().filter(e => e.id !== id));
  renderList();
  showToast('削除しました');
}

function renderExport() {
  const entries = load();
  const months = [...new Set(entries.map(e => e.month))].sort().reverse();
  const total = entries.reduce((s,e) => s+e.amount, 0);

  document.getElementById('exportStats').innerHTML = `
    <div class="stat-box"><div class="stat-label">総件数</div><div class="stat-value">${entries.length}件</div></div>
    <div class="stat-box"><div class="stat-label">合計金額</div><div class="stat-value">¥${total.toLocaleString()}</div></div>
  `;

  document.getElementById('monthSummaryList').innerHTML = months.map(m => {
    const me = entries.filter(e => e.month === m);
    const amt = me.reduce((s,e) => s+e.amount, 0);
    return `<div class="month-summary-row">
      <span class="month-summary-label">${m}</span>
      <span style="color:var(--text2);font-size:12px">${me.length}件</span>
      <span class="month-summary-val">¥${amt.toLocaleString()}</span>
    </div>`;
  }).join('');

  const sel = document.getElementById('exportMonthSelect');
  sel.innerHTML = months.map(m =>
    `<option value="${m}">${m}（${entries.filter(e=>e.month===m).length}件）</option>`
  ).join('');
}

function exportCSV() {
  const m = document.getElementById('exportMonthSelect').value;
  if (!m) { showToast('データがありません'); return; }
  const entries = load().filter(e => e.month === m).sort((a,b) => a.date.localeCompare(b.date));
  downloadCSV(entries, `${m}_manual.csv`);
}
function exportAllCSV() {
  const entries = load().sort((a,b) => a.date.localeCompare(b.date));
  if (!entries.length) { showToast('データがありません'); return; }
  downloadCSV(entries, 'all_manual.csv');
}
function downloadCSV(entries, filename) {
  const srcLabel = { receipt:'レシート', pdf:'PDF', manual:'手入力' };
  const header = '日付,摘要,金額,勘定科目,ソース,備考';
  const rows = entries.map(e =>
    [e.date, `"${e.summary}"`, e.amount, `"${e.category}"`, srcLabel[e.source]||e.source, `"${e.note||''}"`].join(',')
  );
  const blob = new Blob(['\uFEFF' + [header,...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename; a.click();
  showToast(`📥 ${filename} をダウンロード`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
